syntax = "proto3";

package engine.core;

// Instrument configuration
message InstrumentConfig {
    string symbol = 1;
    string exchange = 2;
    int32 tick_size_decimals = 3;
    double min_order_size = 4;
    double max_order_size = 5;
    string asset_class = 6;  // e.g., "equity", "crypto", "futures"
}

// Generic key-value configuration
message EngineConfig {
    string name = 1;
    string version = 2;
    map<string, string> parameters = 3;
    repeated InstrumentConfig instruments = 4;
}
