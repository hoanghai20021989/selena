name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Debug
  BUILD_DIR: _build/clang_Debug

jobs:
  build-and-test:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: ./configure.sh --skip-conan || ./configure.sh

      - name: Build
        run: ninja -C ${{ env.BUILD_DIR }}

      - name: Test
        run: ninja -C ${{ env.BUILD_DIR }} tests_fast
